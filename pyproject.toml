[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magnific"
version = "0.1.0"
description = "Config-driven, resumable creative pipeline (story → preview → video)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Magnific Contributors" }]
dependencies = [
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
  "google-genai>=1.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
magnific = "magnific.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magnific"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
